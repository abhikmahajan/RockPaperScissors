<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>

</head>
<body>

    <div>
        <h1 class="text-4xl flex justify-center mt-4 font-semibold ">Rock-Paper-Scissors</h1>
    </div>

    <div id="choices" class="flex justify-center text-4xl gap-10 mt-5 ">
        <button onclick="playGame('rock')" class="bg-blue-700 p-3 rounded-2xl">👊</button>
        <button onclick="playGame('paper')" class="bg-blue-700 p-3 rounded-2xl">🤚</button>
        <button onclick="playGame('scissors')" class="bg-blue-700 p-3 rounded-2xl">✌️</button>
    </div>

    <div id="playerDisplay" class="text-2xl font-bold flex justify-center mt-4">
        <p>PLAYER: </p>
    </div>

    <div id="computerDisplay" class="text-2xl font-bold flex justify-center mt-4">
        <p>COMPUTER: </p>
    </div>


<div>
    <div class="flex justify-center">Player Score: <span id="playerScore" class="text-green-700 mx-2"> 0</span>
    </div>
    <div class="flex justify-center">Computer Score: <span id="computerScore" class="text-red-700 ml-2">0</span>
    </div>
    </div>

    <div id="resultDisplay" class="text-4xl font-bold flex justify-center mt-4">
        
    </div>

    <script src="script.js"></script>
</body>
</html>
